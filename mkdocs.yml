site_name: FLOWCAL Knowledge Hub
site_description: End-user knowledge base for the FLOWCAL product suite
site_author: FLOWCAL Team
docs_dir: docs
site_dir: site
not_in_nav: |
  help/Content/**
  help/Default.md
  help/Default_CSH.md

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: deep-orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: deep-orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.tooltips
    - announce.dismiss
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/gauge
    repo: fontawesome/brands/github
    admonition:
      note:    octicons/tag-16
      tip:     octicons/flame-16
      warning: octicons/alert-16
      info:    octicons/info-16

plugins:
  - search:
      lang: en
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: fc-mermaid-source
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index:     !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# nav is explicit (MkDocs Material only auto-discovers when nav is absent entirely).
# The Publishing Agent appends new page entries here under the matching tab below —
# it does not restructure existing tabs or reorder entries.
#   getting-started/ → "Getting Started" tab
#   core-features/   → "Core Features" tab
#   practice/        → "Practice" tab (quiz decks)
#   visual/          → "Visual Story" tab
#   workflows/       → "Workflows" tab
#   misc/            → "Misc" tab (pipeline fallback for unclassified content)

nav:
  - Home: index.md
  - Start Here:
    - What is FLOWCAL?: help/Content/FLOWCAL 10/Getting Started/What Is FLOWCAL.md
    - FLOWCAL Data Journey: getting-started/flowcal-data-journey.md
    - New Joiner Learning Path: learn/index.md
    - Glossary and Acronyms: help/Content/FLOWCAL 10/_Glossary/Measurement Glossary.md
  - Platform Setup and Administration:
    - Overview: platform/index.md
    - Installation:
      - Oracle Database Installation: platform/installation.md
      - FLOWCAL Application Installation: help/Content/FLOWCAL 10/Admin Options/Install & Configure Services.md
      - SQL Developer Setup: platform/installation.md
    - Systems and Database Checks: help/Content/FLOWCAL 10/Admin Options/Create Systems.md
    - Users, Groups, and Security: help/Content/FLOWCAL 10/Settings Manager/Security/Group Access.md
    - Configuration Reference: help/Content/FLOWCAL 10/Settings Manager/System/System Configuration/System Configuration.md
  - Product Knowledge:
    - Overview: product/index.md
    - Products and Fluids: core-features/volume-editor.md
    - Systems: help/Content/FLOWCAL 10/Admin Options/Create Systems.md
    - Locations: help/Content/FLOWCAL 10/Locations/About Locations.md
    - Location Fundamentals: core-features/locations.md
    - Meters: help/Content/FLOWCAL 10/Meters/About Meters.md
    - Meter Fundamentals: core-features/meters.md
    - Assignments and Sources: help/Content/FLOWCAL 10/Source Analysis/Quality Assignment Editor/Configuring Assignments.md
    - Entity Relationships: help/Content/FLOWCAL 10/Admin Options/Entity Relationship Diagrams.md
  - Daily Operations:
    - Overview: operations/index.md
    - List Views, Queries, and Bulk Changes: help/Content/FLOWCAL 10/List Editor/List Editor.md
    - File Imports: help/Content/FLOWCAL 10/Imports/Meter Data/Import Meter Data.md
    - Tickets: help/Content/FLOWCAL 10/Tickets/Ticket Editor.md
    - Tickets Overview: core-features/tickets.md
    - Validation and Exceptions: help/Content/FLOWCAL 10/Exceptions/Exception Resolver/Exception Resolver.md
    - Close Process: help/Content/FLOWCAL 10/Close Data/Close Groups/About Close Groups.md
    - Post-Processing Approval (PPA): help/Content/FLOWCAL 10/PPA/PPA Editor.md
  - Processing and Integration:
    - Overview: processing/index.md
    - Rollups: help/Content/FLOWCAL 10/Calculated Meter Editor/Formulas/Calculated Meter Rollup Process.md
    - FcDataBoss: processing/index.md
    - FcLoader: help/Content/FLOWCAL 10/Admin Options/FcLoader.md
    - Imports and Automation: help/Content/FLOWCAL 10/Admin Options/Configure Imports.md
    - Data Flow Reference: visual/index.md
  - Reporting and Exports:
    - Overview: reporting/index.md
    - Reports: help/Content/FLOWCAL 10/Reports/Standard Reports.md
    - Exports: help/Content/FLOWCAL 10/Reports/Exports.md
    - Rollup Viewer: core-features/rollup-viewers.md
  - Learn FLOWCAL:
    - Overview: learn/index.md
    - Video Walkthroughs: learn/videos.md
    - Guided Learning Paths: getting-started/flowcal-data-journey.md
    - Quizzes:
      - Getting Started Quiz: practice/getting-started-quiz.md
      - Core Features Quiz: practice/core-features-quiz.md
    - Flashcards: practice/flashcards.md
    - Visual Workflows: visual/index.md
  - Reference:
    - Overview: reference/index.md
    - Internal Help Documentation: help/index.md
    - FAQs and Troubleshooting: reference/index.md
    - Glossary: help/Content/FLOWCAL 10/_Glossary/Measurement Glossary.md
    - Release and Change Notes: help/Content/FLOWCAL 10/_Home Page Content/Release Note Index.md

extra:
  generator: false
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:support@flowcal.internal
      name: Email Support

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mermaid-config.js
  - javascripts/visual.js
  - javascripts/flashcards.js
