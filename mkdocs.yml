site_name: FLOWCAL Knowledge Hub
site_description: End-user knowledge base for the FLOWCAL product suite
site_author: FLOWCAL Team
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: deep-orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: deep-orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.tooltips
    - announce.dismiss
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/gauge
    repo: fontawesome/brands/github
    admonition:
      note:    octicons/tag-16
      tip:     octicons/flame-16
      warning: octicons/alert-16
      info:    octicons/info-16

plugins:
  - search:
      lang: en
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index:     !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# nav is explicit (MkDocs Material only auto-discovers when nav is absent entirely).
# The Publishing Agent appends new page entries here under the matching tab below —
# it does not restructure existing tabs or reorder entries.
#   getting-started/ → "Getting Started" tab
#   core-features/   → "Core Features" tab
#   practice/        → "Practice" tab (quiz decks)
#   visual/          → "Visual Story" tab
#   workflows/       → "Workflows" tab
#   misc/            → "Misc" tab (pipeline fallback for unclassified content)

nav:
  - Home: index.md
  - Start Here:
    - FLOWCAL Data Journey: getting-started/flowcal-data-journey.md
    - Hydrocarbon Fundamentals: getting-started/hydrocarbon-fundamentals.md
    - Natural Gas Measurement Process: getting-started/natural-gas-101.md
    - Well Extraction and Hydraulic Fracturing: getting-started/well-extraction.md
  - Contents: contents.md
  - Product Knowledge:
    - Overview: product/index.md
    - Meters and Fundamentals:
      - Meters: core-features/meters.md
      - Meter Calibration and Testing: core-features/meter-testing.md
    - Locations and Systems:
      - Locations: core-features/locations.md
      - Gathering Systems: core-features/gathering-systems.md
    - Infrastructure:
      - Pipeline Infrastructure: core-features/pipelines.md
      - Gas Distribution: core-features/distribution.md
    - Data Processing:
      - Separation and Well Stream Factors: core-features/separation.md
      - Volume Editor: core-features/volume-editor.md
  - Daily Operations:
    - Overview: operations/index.md
    - Tickets: core-features/tickets.md
    - Toolbox: core-features/toolbox.md
  - Reporting and Exports:
    - Overview: reporting/index.md
    - Reports: core-features/reports.md
    - Rollup Viewers: core-features/rollup-viewers.md
  - Learn FLOWCAL:
    - Overview: learn/index.md
    - Quizzes:
      - Getting Started Quiz: practice/getting-started-quiz.md
      - Core Features Quiz: practice/core-features-quiz.md
    - Visual Workflows: visual/index.md
  - Reference:
    - Overview: reference/index.md
    - Glossary: core-features/glossary.md
    - Advanced Topics:
      - Admin Options: core-features/admin-options.md
      - Application Interface: core-features/application-interface.md
      - Auto Edits: core-features/auto-edits.md
      - BLM Compliance: core-features/blm.md
      - Business Month Editor: core-features/business-month-editor.md
      - Calculated Meter Editor: core-features/calculated-meter-editor.md
      - Close Dates Editor: core-features/close-data.md
      - Comparison Location Editor: core-features/comparison-locations.md
      - Dashboard Manager: core-features/dashboard-manager.md
      - Densitometer Editor: core-features/densitometer-editor.md
      - Edit Approvals: core-features/edit-approvals.md
      - External Volume Interface: core-features/external-volume-interface.md
      - FLOWCAL 10 Getting Started: core-features/flowcal10-getting-started.md
      - Imports: core-features/imports.md
      - Liquid Cavern Editor: core-features/liquid-cavern-editor.md
      - List Editor: core-features/list-editor.md
      - Message Directory: core-features/messages.md
      - PPA Editor: core-features/ppa.md
      - Sample Analyses: core-features/sample-analyses.md
      - Set Points: core-features/set-points.md
      - Settings Manager: core-features/settings-manager.md
      - Sources: core-features/sources.md
      - Tank Editor: core-features/tank-editor.md
      - Business Requirements Document: core-features/brd.md

extra:
  generator: false
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:support@flowcal.internal
      name: Email Support

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/visual.js
  - javascripts/contents.js
